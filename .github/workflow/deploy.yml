name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"] # Cambia in "master" se necessario

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install and Build
        run: |
          npm install
          npm run build
        env:
          # Qui avviene la magia: GitHub inietta il Secret nella variabile d'ambiente
          VITE_BE_URL: ${{ secrets.VITE_BE_URL }}

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist # O 'build', controlla la cartella prodotta dal tuo framework
          branch: gh-pages